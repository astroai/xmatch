[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmatch"
version = "0.2.0"
description = "A tool for cross-matching astronomical catalogues using various methods."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "Seb Fabbro", email = "sebfabbro@gmail.com" },
]
keywords = ["astronomy", "crossmatch", "catalogue", "stilts", "tap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "polars >= 1.0",
    "pandas >= 1.3",
    "pyarrow >= 7.0",
    "astropy >= 5.0",
    "pyyaml >= 5.4",
    "pyvo >= 1.4",
    "keyring >= 23.0",
    "astroquery >= 0.4.6",
    ]

[project.optional-dependencies]
# HATS / HiPSCat catalogue support.
hats = ["lsdb"]
# Optional keyring backends.
keyring_backends = [
    "keyrings.cryptfile",
    "keyrings.osx",
    "keyrings.alt",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
# This makes the 'xmatch' command available after installation
xmatch = "xmatch.cli:main"

[project.urls] # Optional
Homepage = "https://github.com/sfabbro/xmatch" # Example
Repository = "https://github.com/sfabbro/xmatch" # Example

# --- Tool specific configuration (e.g. for linters/formatters) ---
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in argument defaults (argparse patterns)
    "SIM108", # ternary vs if/else, readability is case-by-case
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["import-untyped", "union-attr", "arg-type", "index"]

[tool.codespell]
ignore-words-list = "activ,strat,oen,suh,vas,mye,fo,hte,ue,nax,ags,bu,acn,vew,ecept,ure,ege,edn,whe,inh,ths,proceedure,eazy,clen,acess,astroid,degress,som,sompz,slac,ges,recal,litterature,ned,aas,alph,legac"
skip = "*.ipynb,pyproject.toml,*.json,pixi.lock,paper/*.cls"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.setuptools.package-data]
"xmatch" = ["*.yaml"]
