[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmatch"
version = "0.1.0"
description = "A tool for cross-matching astronomical catalogues using various methods."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "Seb Fabbro", email = "sebfabbro@gmail.com" },
]
keywords = ["astronomy", "crossmatch", "catalogue", "stilts", "tap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "pandas >= 1.3",
    "astropy >= 5.0",
    "pyyaml >= 5.4",
    "pyvo >= 1.4",
    "keyring >= 23.0",
    "astroquery >= 0.4.6",
    "astropy-healpix >= 0.6",
    "pyarrow >= 7.0",
    "healpy >= 1.16.0",
    ]

[project.optional-dependencies]
# Example: optional keyring backends
keyring_backends = [
    "keyrings.cryptfile",
    "keyrings.osx", # If on macOS
    "keyrings.alt", # Other backends
]
# Example: for development
dev = [
    "pytest",
    "ruff", # Example linter/formatter
    "black", # Code formatter
    "mypy",  # Type checking
    "sphinx", # Documentation
]

[project.scripts]
# This makes the 'xmatch' command available after installation
xmatch = "xmatch.cli:main"

[project.urls] # Optional
Homepage = "https://github.com/sfabbro/xmatch" # Example
Repository = "https://github.com/sfabbro/xmatch" # Example

# --- Tool specific configuration (e.g. for linters/formatters) ---
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = [
    "E501", "B008", "SIM115", "SIM108", "B904", "B007", "SIM102", "B028", "B006",
    "SIM105", "SIM101", "B023", "SIM118", "B018", "SIM117", "SIM210", "E402",
    "SIM103", "B011", "B017", "B024", "SIM113", "E731", "F821"
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["union-attr", "misc", "dict-item", "has-type", "arg-type", "no-redef", "attr-defined", "assignment", "operator", "var-annotated", "call-overload", "return-value", "valid-type", "index", "no-any-return", "call-arg"]

[tool.codespell]
ignore-words-list = "activ,strat,oen,suh,vas,mye,fo,hte,ue,nax,ags,bu,acn,vew,ecept,ure,ege,edn,whe,inh,ths,proceedure,eazy,clen,acess,astroid,degress,som,sompz,slac,ges,recal,litterature,ned,aas,alph,legac"
skip = "*.ipynb,pyproject.toml,*.json,pixi.lock,paper/*.cls"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.setuptools.package-data]
"xmatch" = ["*.yaml"]
