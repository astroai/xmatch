[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmatcher"
version = "0.5.1"
description = "High-performance, format-agnostic astronomical catalogue crossmatching and multi-survey union toolkit."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Seb Fabbro", email = "sebfabbro@gmail.com" },
]
keywords = ["astronomy", "crossmatch", "catalogue", "hats", "healpix", "polars", "tap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy >= 2.4",
    "polars >= 1.40",
    "pyarrow >= 25.0",
    "astropy >= 7.2",
    "scipy >= 1.18",
    "pyyaml >= 6.0.3",
    "pyvo >= 1.8",
]

[project.optional-dependencies]
# VizieR and CDS XMatch remote service backends.
cds = ["astroquery>=0.4.11"]
# Fast, Arrow/Polars-native local FITS table reader.
torchfits = ["torchfits>=1.0.0rc4"]
# HEALPix spatial zoning engine.
zone = ["cdshealpix>=0.8"]
# HATS / HiPSCat catalogue support.
hats = ["hats>=0.7", "cdshealpix>=0.8"]
# Native HATS+Ray pixel matcher.
hats-ray = ["hats>=0.7", "ray>=2.50", "cdshealpix>=0.8"]
# Ray distributed engine (parallel HEALPix pixel-batch matching).
ray = ["ray>=2.50", "cdshealpix>=0.8"]
# Machine-learning and gradient-boosted probabilistic matchers.
ml = ["scikit-learn", "xgboost", "lightgbm", "joblib"]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "mypy>=2.0",
]

[project.scripts]
xmatcher = "xmatcher.cli:main"

[project.urls]
Homepage = "https://github.com/astroai/xmatcher"
Repository = "https://github.com/astroai/xmatcher"
Documentation = "https://github.com/astroai/xmatcher/tree/main/docs"
Issues = "https://github.com/astroai/xmatcher/issues"

# --- Tool specific configuration (e.g. for linters/formatters) ---
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in argument defaults (argparse patterns)
    "SIM108", # ternary vs if/else, readability is case-by-case
    "UP031",  # printf-style formatting in logging/SQL templates
]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
warn_unreachable = true
disable_error_code = ["import-untyped", "union-attr", "arg-type", "index"]

[tool.codespell]
ignore-words-list = "aas,anc,fof,hav,nd,ned"
skip = "*.ipynb,pyproject.toml,*.json,pixi.lock,paper/*.cls"

[tool.setuptools.package-data]
"xmatcher" = ["*.yaml", "fixtures/*.json"]

[tool.pytest.ini_options]
# Register custom markers so pytest doesn't emit "unknown marker" warnings.
markers = [
    "slow: large/slow tests; skip with pytest -m 'not slow'",
    "bench: benchmark tests comparing matcher engines; skip with pytest -m 'not bench'",
]
