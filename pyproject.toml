[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmatch"
version = "0.5.0"
description = "High-performance, format-agnostic astronomical catalogue crossmatching and multi-survey union toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  { name = "Seb Fabbro", email = "sebfabbro@gmail.com" },
]
keywords = ["astronomy", "crossmatch", "catalogue", "hats", "healpix", "polars", "tap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy >= 1.24",
    "polars >= 1.0",
    "pandas >= 1.3",
    "pyarrow >= 7.0",
    "astropy >= 5.0",
    "scipy >= 1.8",
    "pyyaml >= 5.4",
    "pyvo >= 1.4",
    "requests >= 2.28",
    "keyring >= 23.0",
    "astroquery >= 0.4.6",
]

[project.optional-dependencies]
# Fast, Arrow/Polars-native local FITS table reader.
torchfits = ["torchfits>=1.0.0rc4"]
# HEALPix spatial zoning engine.
zone = ["cdshealpix"]
# HATS / HiPSCat catalogue support (native path needs hats; LSDB is legacy).
hats = ["hats", "lsdb", "cdshealpix"]
# Native HATS+Ray pixel matcher (no Dask).
hats-ray = ["hats", "ray", "cdshealpix"]
# Tensor-native nearest-neighbour engine.
torchsky = ["torchsky>=0.4.0.dev0"]
# Ray distributed engine (parallel HEALPix pixel-batch matching).
ray = ["ray", "cdshealpix"]
# Machine-learning and gradient-boosted probabilistic matchers.
ml = ["scikit-learn", "xgboost", "lightgbm", "joblib"]
# Bayesian N-way simultaneous crossmatching backend.
nway = ["nway>=4.7.1"]
# Optional keyring backends.
keyring_backends = [
    "keyrings.cryptfile",
    "keyrings.osx",
    "keyrings.alt",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
xmatch = "xmatch.cli:main"

[project.urls]
Homepage = "https://github.com/astroai/xmatch"
Repository = "https://github.com/astroai/xmatch"
Documentation = "https://github.com/astroai/xmatch/tree/main/docs"
Issues = "https://github.com/astroai/xmatch/issues"

# --- Tool specific configuration (e.g. for linters/formatters) ---
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in argument defaults (argparse patterns)
    "SIM108", # ternary vs if/else, readability is case-by-case
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["import-untyped", "union-attr", "arg-type", "index"]

[tool.codespell]
ignore-words-list = "activ,strat,oen,suh,vas,mye,fo,hte,ue,nax,ags,bu,acn,vew,ecept,ure,ege,edn,whe,inh,ths,proceedure,eazy,clen,acess,astroid,degress,som,sompz,slac,ges,recal,litterature,ned,aas,alph,legac,desig,bund,fof,crate"
skip = "*.ipynb,pyproject.toml,*.json,pixi.lock,paper/*.cls"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.setuptools.package-data]
"xmatch" = ["*.yaml", "fixtures/*.json"]

[tool.pytest.ini_options]
# Register custom markers so pytest doesn't emit "unknown marker" warnings.
markers = [
    "slow: large/slow tests; skip with pytest -m 'not slow'",
    "bench: benchmark tests comparing matcher engines; skip with pytest -m 'not bench'",
]
