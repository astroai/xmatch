# --- Archive Capabilities ---
# Defines known data archives and their services/capabilities relevant for crossmatching.
archives:
  cds:
    description: "Strasbourg Astronomical Data Center (CDS)"
    # TAP Service (Preferred for column selection and complex queries)
    tap_service:
      access_url: "http://tapvizier.u-strasbg.fr/TAPVizieR/tap"
      access_method: tap
      column_selection_supported: true
      # Assumed ADQL features, verify if specific ones like UPLOAD are needed/supported
      # TEMPORARILY REMOVED 'table_upload' for testing fallback
      adql_features: [cone_search, polygon_search, table_join]
    # CDS X-Match Service (Alternative, potentially faster for simple matches)
    xmatch_service:
      # Astroquery uses a specific mechanism, not just a URL
      access_method: cds_xmatch
      # Check astroquery docs for exact limitations. Assumed it might not allow easy column selection.
      column_selection_supported: false
      # Can it accept uploaded tables? Or only VizieR table IDs?
      crossmatch_input_methods: [remote_table_query] # Add 'table_upload' if supported
    has_crossmatch_service: true # Primarily via X-Match service
    service_priority: [tap_service, xmatch_service] # Preference order

  noao_datalab:
    description: "NOIRLab Astro Data Lab"
    # TAP Service is the primary access method here
    tap_service:
      access_url: "https://datalab.noirlab.edu/tap"
      access_method: tap
      column_selection_supported: true
      # Assumed ADQL features. VOSpace integration might allow uploads.
      adql_features: [cone_search, polygon_search, table_join, table_upload] # Assuming upload possible via TAP/VOSpace
    # Crossmatching is typically done via TAP queries (self-join or joining uploaded tables)
    has_crossmatch_service: true # Via TAP capabilities
    crossmatch_service_name: "TAP Crossmatch"
    # Can join remote tables, search shapes, and accept uploads
    crossmatch_input_methods: [remote_table_join, cone_search, polygon_search, table_upload]
    service_priority: [tap_service]

  # Add other relevant archives here later (e.g., ESA Gaia Archive)
  esa_gaia:
    description: "ESA Gaia Archive"
    tap_service:
      access_url: "https://gea.esac.esa.int/tap-server/tap"
      access_method: tap
      column_selection_supported: true
      # Gaia TAP supports async jobs, uploads, UDFs etc.
      adql_features: [cone_search, polygon_search, table_join, table_upload, async_jobs, user_defined_functions]
    has_crossmatch_service: true # Via TAP capabilities (upload, join)
    crossmatch_service_name: "TAP Crossmatch"
    crossmatch_input_methods: [remote_table_join, cone_search, polygon_search, table_upload]
    service_priority: [tap_service]

# --- Catalogue Aliases ---
# Maps simple names to specific catalogue versions
# This allows users to reference catalogues with simple names like "gaia" or "galex"
# without needing to know the specific version or archive
catalogue_aliases:
  # ESA Gaia Data
  gaia: "gaia_esa" # Default to ESA's version
  gaia_dr3: "gaia_esa"
  gaiadr3: "gaia_esa"

  # CDS Data
  galex: "galex_cds"
  vhs: "vhs_cds"

  # NOAO Data
  delve: "delve_noao"
  desils: "desils_noao"
  ukidss: "ukidsslas_noao"
  ukidsslas: "ukidsslas_noao"

# --- Catalogue Definitions ---
# Defines specific astronomical catalogues, their location, and properties.
# NOTE: Catalogue names are lowercase for easier command-line use.
# NOTE: Column names should reflect the names in the *source* archive table.
catalogues:

  # --- CDS Catalogues ---
  gaia_cds:
    description: "Gaia (Source Catalogue) via CDS VizieR"
    archive: cds
    service_id: tap_service
    release: "dr3"
    access_identifier: "I/355/gaiadr3"
    table_name: "I/355/gaiadr3" # Same as access_identifier for VizieR TAP
    epoch: 2016.0
    # Estimated size (rows) - helps strategy selection. Can be 'small', 'medium', 'large', 'huge', or number
    estimated_size: 'huge' # ~1.8 billion
    ra_column: "RA_ICRS"
    dec_column: "DE_ICRS"
    id_column: "Source" # Add ID column
    # Default columns: VizieR names. pmRA/pmDE are in mas/yr
    default_columns: ["Source", "RA_ICRS", "DE_ICRS", "pmRA", "pmDE", "Plx", "Gmag", "Epoch"]
    pm_ra_column: "pmRA"
    pm_dec_column: "pmDE"
    epoch_column: "Epoch"
    # Positional Error Configuration (check VizieR column names)
    ra_err_column: "e_RA_ICRS"
    dec_err_column: "e_DE_ICRS"
    corr_column: "RADECor"
    pos_err_units: "mas"
    # Default error if specific columns are missing/null (in arcsec)
    default_pos_error_arcsec: 0.05

  galex_cds:
    description: "GALEX All-Sky Imaging Survey (AIS) via CDS VizieR TAP"
    archive: cds
    service_id: tap_service
    release: "gr67"
    access_identifier: "II/335"
    table_name: "II/335/galex_ais"
    epoch: 2000.0
    estimated_size: 'large' # ~83 million
    ra_column: "RAJ2000"
    dec_column: "DEJ2000"
    id_column: "obijd" # Add ID column
    default_columns: ["obijd", "RAJ2000", "DEJ2000", "FUVmag", "e_FUVmag", "NUVmag", "e_NUVmag", "Fafl", "Nafl", "Fexf", "Nexf", "Ffux", "e_Fflux", "Nfux", "e_Nflux"]
    default_pos_error_arcsec: 3.0

  vhs_cds:
    description: "VISTA Hemisphere Survey via CDS VizieR TAP"
    archive: cds
    service_id: tap_service
    release: "dr5"
    access_identifier: "II/367/vhs_dr5"
    table_name: "II/367/vhs_dr5"
    epoch: 2000.0
    estimated_size: 'huge' # ~1.3 billion
    ra_column: "RAJ2000"
    dec_column: "DEJ2000"
    id_column: "SrcID" # Add ID column
    default_columns: ["SrcID", "RAJ2000", "DEJ2000", "Yap3", "e_Yap3", "Jap3", "e_Jap3", "Hap3", "e_Hap3", "Ksap3", "e_Ksap3"]
    pos_err_units: "arcsec"
    default_pos_error_arcsec: 0.3

  # --- NOAO Data Lab Catalogues ---
  delve_noao:
    description: "DECam Local Volume Exploration Survey (DELVE) via NOIRLab Data Lab"
    archive: noao_datalab
    service_id: tap_service
    release: "dr2"
    access_identifier: "delve_dr2.objects"
    table_name: "delve_dr2.objects"
    epoch: 2000.0
    estimated_size: 'huge' # ~2.2 billion
    ra_column: "ra"
    dec_column: "dec"
    id_column: "quick_object_id" # Add ID column
    default_columns: ["quick_object_id", "ra", "dec", "mag_auto_g", "mag_auto_r", "mag_auto_i", "mag_auto_z", "magerr_auto_g", "magerr_auto_r", "magerr_auto_i", "magerr_auto_z"]
    pos_err_units: "arcsec"
    default_pos_error_arcsec: 0.1

  gaia_noao:
    description: "Gaia (Source Catalogue) mirrored/available via NOIRLab Data Lab TAP"
    archive: noao_datalab
    service_id: tap_service
    release: "dr3"
    access_identifier: "gaia_dr3.gaia_source"
    table_name: "gaia_dr3.gaia_source"
    epoch: 2016.0
    estimated_size: 'huge'
    ra_column: "ra" # Assuming same names as ESA
    dec_column: "dec"
    id_column: "source_id" # Add ID column
    default_columns: ["source_id", "ra", "dec", "pmra", "pmdec", "parallax", "phot_g_mean_mag", "ref_epoch"]
    pm_ra_column: "pmra"
    pm_dec_column: "pmdec"
    epoch_column: "ref_epoch"
    ra_err_column: "ra_error"
    dec_err_column: "dec_error"
    corr_column: "ra_dec_corr"
    pos_err_units: "mas"
    default_pos_error_arcsec: 0.01

  desils_noao:
    description: "DESI Legacy Imaging Surveys (LS) via NOIRLab Data Lab TAP"
    archive: noao_datalab
    service_id: tap_service
    release: "dr10"
    access_identifier: "ls_dr10.tractor"
    table_name: "ls_dr10.tractor"
    epoch: 2015.0
    estimated_size: 'huge' # ~1.5 billion
    ra_column: "ra"
    dec_column: "dec"
    id_column: "ls_id" # Add ID column
    default_columns: ["ls_id", "ra", "dec", "mag_g", "mag_r", "mag_i", "mag_z", "mag_w1", "mag_w2", "mag_w3", "mag_w4", "type"]
    # Add error columns if available and needed
    # ra_err_column: "ra_ivar" # Example, check schema (often inverse variance)
    # dec_err_column: "dec_ivar"
    # pos_err_units: "ivar" # Or convert ivar to arcsec error
    default_pos_error_arcsec: 0.1 # Approximate default

  ukidsslas_noao:
    description: "UKIDSS Large Area Survey (LAS) via NOIRLab Data Lab"
    archive: noao_datalab
    service_id: tap_service
    release: "dr11plus"
    access_identifier: "ukidss_dr11plus.lassource"
    table_name: "ukidss_dr11plus.lassource"
    epoch: 2000.0
    estimated_size: 'large' # ~88 million
    ra_column: "ra"
    dec_column: "dec"
    id_column: "sourceid" # Add ID column
    default_columns: ["sourceid", "ra", "dec", "yapermag3", "yapermag3err", "hapermag3", "hapermag3err", "kapermag3", "kapermag3err", "japermag3", "japermag3err"]
    ra_err_column: "sigra" #
    dec_err_column: "sigdec"
    # corr_column: # No correlation term usually provided
    pos_err_units: "arcsec"
    default_pos_error_arcsec: 0.05

  # --- ESA Archive Catalogues ---
  gaia_esa:
    description: "Gaia Data Release 3 (ESA Archive)"
    archive: esa_gaia
    service_id: tap_service
    release: "dr3"
    access_identifier: "gaiadr3.gaia_source"
    table_name: "gaiadr3.gaia_source"
    epoch: 2016.0
    estimated_size: 'huge' # ~1.8 billion
    ra_column: "ra"
    dec_column: "dec"
    id_column: "source_id"
    default_columns: ["source_id", "ra", "dec", "pmra", "pmdec", "parallax", "phot_g_mean_mag", "ref_epoch"]
    pm_ra_column: "pmra"
    pm_dec_column: "pmdec"
    epoch_column: "ref_epoch"
    ra_err_column: "ra_error"
    dec_err_column: "dec_error"
    corr_column: "ra_dec_corr"
    pos_err_units: "mas"
    default_pos_error_arcsec: 0.01

  # --- NOAO Pre-Computed Crossmatch Catalogues ---
  ukidss_gaia_xmatch_noao:
    description: "UKIDSS DR11 LAS x Gaia DR3 Pre-computed Crossmatch (NOAO)"
    archive: noao_datalab
    service_id: tap_service
    release: "x1p5" # Indicate it's a crossmatch product at 1.5 arcsec
    # The actual table name on the NOAO TAP service
    access_identifier: "ukidss_dr11plus.x1p5__lassource__gaia_dr3__gaia_source"
    table_name: "ukidss_dr11plus.x1p5__lassource__gaia_dr3__gaia_source"
    # This table typically only contains IDs and potentially coords/sep
    # Define the key ID columns based on expected NOAO naming convention
    # We'll use these keys in the `--join-keys` argument later
    ukidss_id_column: "id1"
    gaia_id_column: "id2"
    ra_column: "ra1"
    dec_column: "dec1"
    # Define some default columns for viewing, including the crucial IDs
    default_columns: ["ra1", "dec1", "ra2", "dec2", "id1", "id2", "distance"]
    estimated_size: 'large' # Size depends on the overlap


# --- STILTS Configuration ---
stilts_config:
  # Optional: Path to stilts.jar or base command (e.g., 'java -jar stilts.jar')
  # If not set, it assumes 'stilts' is in the system PATH
  # stilts_cmd_base: "/path/to/stilts.jar"
  stilts_cmd_base: null

  # Optional: Java options for STILTS
  # java_opts: "-Xmx4G"
  java_opts: null

  # Optional: Temporary directory for STILTS intermediate files
  # tmpdir: "/path/to/tmp"
  tmpdir: null

  # Global default positional error floor (arcseconds) applied if no catalogue-specific default found
  default_floor_error_arcsec: 0.01 # Small value, e.g., 10 mas
