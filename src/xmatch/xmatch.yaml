# --- STILTS Configuration ---
stilts_config:
  # Optional: Path to stilts.jar or base command (e.g., 'java -jar stilts.jar')
  # If not set, it assumes 'stilts' is in the system PATH
  # stilts_cmd_base: "/path/to/stilts.jar"
  stilts_cmd_base: null

  # Optional: Java options for STILTS
  # java_opts: "-Xmx4G"
  java_opts: null

  # Optional: Temporary directory for STILTS intermediate files
  # tmpdir: "/path/to/tmp"
  tmpdir: null

  # Global default positional error floor (arcseconds) applied if no catalogue-specific default found
  default_floor_error_arcsec: 0.01 # Small value, e.g., 10 mas
