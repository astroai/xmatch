default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: local
    hooks:
      - id: mypy
        name: type checks in the locked scientific environment
        entry: pixi run --as-is mypy src/xmatcher tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: ci-local-pre-push
        name: offline test gate
        entry: pixi run ci-local
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
