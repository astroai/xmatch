# Quarterly AI-agent PR cleanup reminder
#
# Schedules a quarterly dry-run scan for stale bolt-/palette-/jules-/
# integrate- branches via scripts/cleanup-stale-prs.py --json.
#
# Posts a maintainer-triage issue when matches are found. NEVER closes
# PRs unattended: the destructive phase (--apply) is always a manual
# step a maintainer runs locally, per docs/audits/quarterly-review.md
# and the runbook in CONTRIBUTING.md.
#
# Aligned with AUDIT.md Tier 3 (committed in 9b807b8). Idempotent across
# scheduled re-runs within a quarter (skips if an open triage issue
# already exists).

name: Quarterly AI-agent PR cleanup

on:
  schedule:
    # 06:00 UTC on the 28th of the prior-quarter's last month (Mar/Jun/Sep/Dec).
    # Day-of-quarter-start timing gave maintainers no heads-up; this fires
    # ~3 days early so the triage issue is in the queue before the quarter
    # turns. workflow_dispatch remains available for ad-hoc manual runs.
    - cron: '0 6 28 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Quarter label in the issue title (default: current).'
        required: false
        default: 'current'
        type: string

permissions:
  # Tight: checkout implicitly grants contents:read on public repos; only
  # issues:write is needed to file the triage issue. pull-requests:read is
  # unused because the script reads via gh under the default GITHUB_TOKEN
  # (which already has repo scope).
  issues: write

# Avoid racing scheduled and manual runs on the same quarter. With
# cancel-in-progress: true a manual workflow_dispatch supersedes the
# scheduled tick and the schedule waits for the next quarter boundary.
concurrency:
  group: q3-review-reminder
  cancel-in-progress: true

jobs:
  scan-and-prompt:
    name: Dry-run scan + triage issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Install jq
        run: |
          command -v jq || (sudo apt-get update -qq && sudo apt-get install -y jq)

      - name: Dry-run scan (--json only)
        id: scan
        run: |
          pixi run python scripts/cleanup-stale-prs.py --json > /tmp/scan.json || {
            echo "Scan failed; aborting." >&2; exit 1; }
          # Bail loudly if the script ever drifts off the array contract.
          # Without this guard, a regression that emits non-JSON (or non-array)
          # would silently post a garbage triage issue. The exit here makes
          # the run a failed Actions run instead.
          jq -e 'type == "array"' /tmp/scan.json >/dev/null || {
            echo "scan.json is not a JSON array; script contract regressed." >&2
            head -3 /tmp/scan.json >&2
            exit 1; }
          total=$(jq 'length' /tmp/scan.json)
          echo "total=${total}"
          echo "total=${total}" >> "$GITHUB_OUTPUT"

      - name: Early exit when zero matches
        if: steps.scan.outputs.total == '0'
        run: |
          echo "Zero stale PRs flagged. Exiting without creating an issue."

      - name: Idempotency lookup (skip if open triage issue exists)
        id: lookup
        if: steps.scan.outputs.total != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the unique label this workflow stamps on triage issues
          # (`automated`) as the discriminator, not fuzzy `--search` text
          # matching (which would also pick up human-authored issues that
          # happen to mention the same phrase).
          existing=$(gh issue list \
            --label automated \
            --state open \
            --search "Quarterly AI-agent PR cleanup in:title" \
            --limit 1 --json number,title | jq 'length')
          echo "Open automated triage issues already: ${existing}"
          echo "skip=${existing}" >> "$GITHUB_OUTPUT"

      - name: Upload scan.json as workflow artifact
        if: steps.scan.outputs.total != '0' && steps.lookup.outputs.skip == '0'
        uses: actions/upload-artifact@v4
        with:
          name: pr-cleanup-scan
          path: /tmp/scan.json
          retention-days: 30

      - name: Open triage issue
        if: steps.scan.outputs.total != '0' && steps.lookup.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total="${{ steps.scan.outputs.total }}"
          quarter_label="${{ inputs.quarter }}"
          if [ "${quarter_label}" = "current" ]; then
            yr=$(date -u +'%Y')
            mo=$(($(date -u +'%-m') - 1))
            q=$((mo / 3 + 1))
            ym="${yr}-Q${q}"
          else
            ym="${quarter_label}"
          fi
          body_file=/tmp/issue-body.md
          {
            echo "# Quarterly AI-agent PR cleanup — ${ym}"
            echo
            echo "Total PRs flagged: ${total}"
            echo
            echo "## Sample candidates"
            echo
            echo "| # | Group | Author | Updated | Head | Title |"
            echo "|---|---|---|---|---|---|"
            # Cap at 15 rows even if there are 200; full dump stays in the
            # workflow artifact. The 'if length > 15 then 15 else length'
            # pattern handles both overflow and underflow cleanly.
            jq -r 'if length > 15 then .[0:15] else . end | .[] | "| \(.number // "-") | \(.group // "-") | \(.author // "-") | \(.updated // "-") | `\(.head // "-")` | `\(.title // "-")` |"' /tmp/scan.json
            echo
            echo "## Triage steps"
            echo
            echo "1. Download the workflow artifact \`pr-cleanup-scan\` (full JSON dump at /tmp/scan.json)."
            echo "2. Verify each candidate against the 14-day review window."
            echo "3. To close the keepers of the run, run:"
            echo
            echo '   ```bash'
            echo '   pixi run python scripts/cleanup-stale-prs.py --apply --json | jq'
            echo '   ```'
            echo
            echo '   \`--apply\` runs the destructive phase FIRST; \`--json\` then emits the post-close state. All status messages route to \`stderr\` so \`jq\` sees pure JSON (commit `31663df`).'
            echo
            echo "4. Re-run this workflow (workflow_dispatch) after triage to confirm the next scan is clean."
          } > "${body_file}"
          gh issue create \
            --title "Quarterly AI-agent PR cleanup — ${ym} (${total} candidates)" \
            --body-file "${body_file}" \
            --label "audit,q3-review,automated" || {
              echo "Could not auto-create issue; manual triage required." >&2; exit 1; }
