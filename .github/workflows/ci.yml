name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal CI: static checks only (full Pixi/pytest deferred until refactor settles).
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install "pre-commit>=4,<5"
      - name: Run pre-commit (all files)
        env:
          # Skip mypy here — keeps CI fast; restore when the package layout stabilizes.
          SKIP: mypy
        run: pre-commit run --all-files --show-diff-on-failure --color always
