[workspace]
name = "xmatch"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
lint = "ruff check ."
format = "ruff format ."
preflight-push = "ruff check . && ruff format --check . && python -m compileall -q src/xmatch tests"
ci-local = "pixi run preflight-push && pytest tests/test_ci_smoke.py -q"
test = "pytest"

[dependencies]
# <3.14: hats / cdshealpix / ray do not all ship cp314 wheels yet.
python = ">=3.11,<3.14"
# hats → numba needs numpy<2.5; conda solve alone picks 2.5.x.
numpy = ">=1.26,<2.5"
pandas = ">=1.3"
astropy = ">=5.0"
pyyaml = ">=5.4"
pyvo = ">=1.4"
keyring = ">=23.0"
astroquery = ">=0.4.6"
pyarrow = ">=7.0"
polars = ">=1.41.2,<2"
ruff = "*"
pytest = "*"
mypy = "*"

[pypi-dependencies]
xmatch = { path = ".", editable = true }
nway = ">=4.7.1, <5"
# HATS-native Ray union engine: always in the dev env so CI runs the new tests.
# (Optional extras `hats` / `hats-ray` / `ray` in pyproject.toml stay for pip users.)
hats = "*"
ray = "*"
cdshealpix = "*"
