[workspace]
name = "xmatch"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
lint = "ruff check ."
format = "ruff format ."
preflight-push = "ruff check . && ruff format --check . && mypy src/xmatch tests scripts && python -m compileall -q src/xmatch tests scripts"
ci-local = { cmd = "python -m pytest -m 'not slow and not bench' -q --strict-markers", depends-on = ["preflight-push"] }
test = "python -m pytest"

[dependencies]
# Python 3.13 is the locked release runtime; 3.14 has separate targeted checks.
python = "3.13.*"
# hats → numba needs numpy<2.5 on conda-forge
numpy = ">=2.4,<2.5"
scipy = ">=1.18"
astropy = ">=7.2"
pyyaml = ">=6.0.3"
pyvo = ">=1.8"
astroquery = ">=0.4.11"
pyarrow = ">=25.0"
polars = ">=1.40"
ruff = ">=0.15"
pytest = ">=9.0"
mypy = ">=2.0"

[pypi-dependencies]
xmatch = { path = ".", editable = true }
# HATS-native Ray union engine: always in the dev env so CI runs the new tests.
# (Optional extras `hats` / `hats-ray` / `ray` in pyproject.toml stay for pip users.)
hats = ">=0.7"
ray = ">=2.50"
cdshealpix = ">=0.8"
