[project]
name = "xmatch"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
lint = "ruff check ."
format = "ruff format ."
test = "pytest"

[dependencies]
python = ">=3.10"
pandas = ">=1.3"
astropy = ">=5.0"
pyyaml = ">=5.4"
pyvo = ">=1.4"
keyring = ">=23.0"
astroquery = ">=0.4.6"
astropy-healpix = ">=0.6"
pyarrow = ">=7.0"
healpy = ">=1.16.0"
ruff = "*"
pytest = "*"
mypy = "*"

[pypi-dependencies]
xmatch = { path = ".", editable = true }
